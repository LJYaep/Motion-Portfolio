name: Deploy portfolio to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backend and Pages packaging
        run: |
          python -m unittest discover -s tests -v
          node tests/test_agreement_workflow.cjs
      - name: Build public files only
        env:
          ENQUIRY_ENDPOINT: ${{ vars.ENQUIRY_ENDPOINT }}
          AGREEMENT_ENDPOINT: ${{ vars.AGREEMENT_ENDPOINT }}
        run: python tools/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
